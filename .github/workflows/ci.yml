# CI for every push and pull request. Render deploys main only after these
# checks pass (autoDeployTrigger: checksPass in render.yaml); see
# docs/release-process.md.
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes older runs pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bloom
          POSTGRES_PASSWORD: bloom
          POSTGRES_DB: bloom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bloom -d bloom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13" # same as the Docker image
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: JS syntax check
        run: for f in ../frontend/*.js; do node --check "$f"; done

      - name: Unit tests
        run: pytest -m unit

      # Local dev and Docker Compose use SQLite...
      - name: Integration tests (SQLite)
        run: pytest -m integration

      # ...and production on Render uses Postgres.
      - name: Integration tests (Postgres)
        run: pytest -m integration
        env:
          TEST_DATABASE_URL: postgresql://bloom:bloom@localhost:5432/bloom_test

      # The on-call responder (incident-response/) has its own deps and tests.
      - name: Responder lint, format and tests
        working-directory: incident-response
        run: |
          pip install -r requirements-dev.txt
          ruff check --output-format=github .
          ruff format --check .
          pytest

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          tags: bloom-beauty-bar:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Start it the way Render does (PORT set) and check it serves the API and
      # the frontend.
      - name: Smoke test the image
        run: |
          docker run -d --name bloom -p 8000:10000 -e PORT=10000 bloom-beauty-bar:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/health && break
            sleep 1
          done
          curl -fsS http://localhost:8000/api/health
          test "$(curl -fsS http://localhost:8000/api/services | grep -o '"id"' | wc -l)" -eq 6
          curl -fsS -o /dev/null http://localhost:8000/

      - name: Container logs
        if: always()
        run: docker logs bloom || true

      # Builds and checks the pinned Claude Code CLI installs; no token needed.
      - name: Build responder image
        run: |
          docker build -t bloom-responder:ci incident-response
          docker run --rm --entrypoint claude bloom-responder:ci --version
