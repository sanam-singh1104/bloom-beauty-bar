# Prometheus receives the app's metrics from the Collector over OTLP
# (--web.enable-otlp-receiver in docker-compose.yml); nothing to scrape.
global:
  evaluation_interval: 15s

otlp:
  # Keep service.name as a label too (it also becomes `job`).
  promote_resource_attributes:
    - service.name

storage:
  tsdb:
    # OTLP batches can arrive slightly out of order.
    out_of_order_time_window: 30m
