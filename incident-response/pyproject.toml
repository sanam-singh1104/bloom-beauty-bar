[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = [
    # Starlette's TestClient warns about httpx; not our code.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

# Same rules as backend/pyproject.toml.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
# FastAPI's Depends() in defaults is idiomatic.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["responder"]
