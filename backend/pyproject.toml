[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: fast tests of backend logic, no app or database",
    "integration: tests through the HTTP API or store against a real SQLite database",
]
filterwarnings = [
    # Starlette's TestClient warns about httpx; not our code.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]
# FastAPI's Depends() in defaults is idiomatic.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
